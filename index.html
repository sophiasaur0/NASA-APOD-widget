<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASA APOD Widget</title>

<style>
html, body{
    margin:0;
    padding:0;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
}

img{
    width:100%;
    display:block;
}

iframe{
    width:100%;
    height:500px;
    border:none;
}

.text{
    padding:20px;
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

.date{
    opacity:.7;
    margin-bottom:16px;
}

p{
    line-height:1.5;
}
</style>

</head>
<body>

<div class="container">

<div id="media"></div>

<div class="text">
<h1 id="title"></h1>
<div id="date" class="date"></div>
<p id="explanation"></p>
</div>

</div>

<script>

fetch("https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY")
.then(response=>response.json())
.then(data=>{

document.getElementById("title").textContent=data.title;
document.getElementById("date").textContent=data.date;
document.getElementById("explanation").textContent=data.explanation;

if(data.media_type==="image"){

document.getElementById("media").innerHTML=
`<img src="${data.hdurl || data.url}" alt="">`;

}else{

document.getElementById("media").innerHTML=
`<iframe src="${data.url}" allowfullscreen></iframe>`;

}

});

</script>

</body>
</html>
