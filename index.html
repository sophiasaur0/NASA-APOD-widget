<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASA APOD Widget</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* Background image */
#background{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    filter:brightness(.88);
    animation:fade 1.2s ease;
}

/* Video support */
#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:none;
}

/* Dark gradient overlay */
.overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.55),
            rgba(0,0,0,.08),
            rgba(0,0,0,0)
        );
}

/* Loading spinner */
#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:20;
}

.spinner{
    width:44px;
    height:44px;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

/* Bottom-right container */
.card{
    position:absolute;
    right:22px;
    bottom:22px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    z-index:10;
    color:white;
}

/* Book button */
.iconButton{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    color:white;
    font-size:20px;
    backdrop-filter:blur(12px);
    background:rgba(20,20,20,.45);
    transition:.25s;
}

.iconButton:hover{
    transform:scale(1.08);
    background:rgba(30,30,30,.65);
}

/* Title/date hidden until hover */
.meta{
    margin-top:10px;
    text-align:right;
    text-shadow:0 2px 10px black;
    max-width:260px;

    opacity:0;
    transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
}

/* Show meta on hover or when description open */
.card:hover .meta,
.meta.show{
    opacity:1;
    transform:translateY(0);
}

.date{
    font-size:11px;
    opacity:.72;
    margin-bottom:3px;
}

.title{
    font-size:14px;
    font-weight:600;
    line-height:1.3;
}

/* Expandable description */
.description{
    margin-top:14px;
    width:320px;
    max-height:0;
    overflow:hidden;
    color:white;
    backdrop-filter:blur(18px);
    background:rgba(18,18,18,.55);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    line-height:1.55;
    font-size:14px;
    transition:
        max-height .35s ease,
        padding .35s ease;
    padding:0 18px;
}

.description.show{
    max-height:420px;
    padding:18px;
}

/* Fade-in animation */
@keyframes fade{
    from{
        opacity:0;
        transform:scale(1.03);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Mobile */
@media(max-width:600px){
    .card{
        right:14px;
        bottom:14px;
    }

    .description{
        width:260px;
    }
}
</style>

<meta property="og:title" content="NASA Astronomy Picture of the Day">
<meta property="og:description" content="Daily NASA Astronomy Picture">
<meta property="og:type" content="website">
<meta property="og:image" content="https://apod.nasa.gov/apod/image/2507/NGC891_hubble_960.jpg">
</head>

<body>

<!-- Loading screen -->
<div id="loading">
    <div class="spinner"></div>
</div>

<div id="background"></div>
<iframe id="video" allowfullscreen></iframe>
<div class="overlay"></div>

<div class="card">

<button
id="toggle"
class="iconButton"
title="Show explanation">
📖
</button>

<div id="meta" class="meta">
    <div id="date" class="date"></div>
    <div id="title" class="title"></div>
</div>

<div id="description" class="description"></div>

</div>

<script>
const API =
"https://api.nasa.gov/planetary/apod?api_key=3s8D60O6dx4Fr1OZFjEZ9EiDEcHdTzblxPKh7mcE";
// Replace DEMO_KEY with your own API key later.

const CACHE_KEY = "nasa_apod_cache";
const today = new Date().toISOString().slice(0,10);

function render(data){

    document.getElementById("title").textContent = data.title;
    document.getElementById("date").textContent = data.date;
    document.getElementById("description").textContent = data.explanation;

    if(data.media_type === "image"){

        document.getElementById("background").style.backgroundImage =
            `url(${data.hdurl || data.url})`;

    }else{

        document.getElementById("background").style.display = "none";

        const frame = document.getElementById("video");
        frame.style.display = "block";
        frame.src = data.url;
    }

    document.getElementById("loading").style.display = "none";
}

// Load from cache first
const cached = localStorage.getItem(CACHE_KEY);

if(cached){

    try{

        const parsed = JSON.parse(cached);

        if(parsed.date === today){

            render(parsed.data);

        }else{

            fetchLatest();

        }

    }catch{

        fetchLatest();

    }

}else{

    fetchLatest();

}

function fetchLatest(){

    fetch(API)
    .then(r => r.json())
    .then(data => {

        localStorage.setItem(CACHE_KEY, JSON.stringify({
            date: today,
            data: data
        }));

        render(data);

    })
    .catch(err => {

        document.getElementById("loading").innerHTML =
            "<div style='color:white;font-size:14px'>Unable to load NASA APOD</div>";

        console.error(err);

    });

}

// Description toggle
const desc = document.getElementById("description");
const meta = document.getElementById("meta");

document.getElementById("toggle").onclick = () => {

    desc.classList.toggle("show");

    // Keep title/date visible while description is open
    if(desc.classList.contains("show")){

        meta.classList.add("show");

    }else{

        meta.classList.remove("show");

    }

};

// Refresh shortly after midnight
setInterval(() => {

    const now = new Date();

    if(now.getHours() === 0 && now.getMinutes() === 1){

        localStorage.removeItem(CACHE_KEY);
        location.reload();

    }

}, 60000);
</script>

</body>
</html>
